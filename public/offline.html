<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080A">
<title>CloudPulse · offline</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; background: #07080A; color: #E4E4E7;
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 380px; text-align: center; }
  .logo { width: 56px; height: 56px; margin: 0 auto 20px; border-radius: 16px; background: #CCFF00;
          display: flex; align-items: center; justify-content: center; }
  h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.02em; color: #FAFAFA; }
  p { margin: 0 0 24px; color: #A1A1AA; }
  a, button {
    display: block; width: 100%; margin-top: 10px; padding: 14px 16px; border-radius: 16px; border: 0;
    font: inherit; font-weight: 600; text-decoration: none; cursor: pointer;
  }
  a { background: #CCFF00; color: #09090B; }
  button { background: rgba(255,255,255,0.05); color: #E4E4E7; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1); }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 256 256"><path fill="#09090B" d="M215.8 109.5 103.8 229.5a8 8 0 0 1-15.6-7.3L104.8 160H48a8 8 0 0 1-5.8-13.5l112-120a8 8 0 0 1 13.6 7.3L151.1 96H208a8 8 0 0 1 7.8 13.5Z"/></svg>
  </div>
  <h1 id="title">Nav interneta</h1>
  <p id="body">Šī lapa vēl nav saglabāta telefonā. Ikdienas pārbaude darbojas arī bez interneta.</p>
  <a id="checkin" href="/checkin">Atvērt pārbaudi</a>
  <button id="retry" type="button" onclick="location.reload()">Mēģināt vēlreiz</button>
</main>
<script>
  // Same language the app uses (saved by LanguageContext), else the phone's.
  var copy = {
    lv: ['Nav interneta', 'Šī lapa vēl nav saglabāta telefonā. Ikdienas pārbaude darbojas arī bez interneta.', 'Atvērt pārbaudi', 'Mēģināt vēlreiz'],
    ru: ['Нет интернета', 'Эта страница ещё не сохранена на телефоне. Ежедневный чек-ин работает и без интернета.', 'Открыть чек-ин', 'Попробовать снова'],
    en: ['No internet', "This page isn't saved on your phone yet. The daily check-in works without internet too.", 'Open check-in', 'Try again']
  };
  var lang = 'lv';
  try { lang = localStorage.getItem('cloudpulse-lang') || ''; } catch (e) {}
  if (!copy[lang]) {
    var nav = (navigator.language || '').toLowerCase();
    lang = nav.indexOf('ru') === 0 ? 'ru' : nav.indexOf('lv') === 0 ? 'lv' : 'en';
  }
  var c = copy[lang];
  document.documentElement.lang = lang;
  document.getElementById('title').textContent = c[0];
  document.getElementById('body').textContent = c[1];
  document.getElementById('checkin').textContent = c[2];
  document.getElementById('retry').textContent = c[3];
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
